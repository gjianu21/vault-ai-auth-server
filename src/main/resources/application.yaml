spring:
  application:
    name: vault-ai-auth-server
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${VAULT_AUTH_DB_USER:VAULT_AUTH}
    password: ${VAULT_AUTH_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:9000}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: VAULT-AUTH-SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  public-url: ${AUTH_PUBLIC_URL:http://localhost:9000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@vault-ai.local}
  internal-api-key: ${INTERNAL_API_KEY}

  oauth2:
    client-id: vault-ai-be
    client-secret: ${OAUTH2_CLIENT_SECRET}
    access-token-ttl: PT5M
    refresh-token-ttl: PT1H

  jwk:
    keystore-path: ${JWK_KEYSTORE_PATH:}
    keystore-password: ${JWK_KEYSTORE_PASSWORD:}
    key-alias: ${JWK_KEY_ALIAS:vault-ai-jwt}
    generate-if-missing: false

  email-verification:
    expiry: PT24H
    resend-cooldown: PT5M

  password-reset:
    expiry: PT30M

  rate-limit:
    capacity: 5
    refill-period: PT1M

  login-lock:
    max-attempts: 5
    lock-duration: PT15M

logging:
  level:
    org.springframework.security: INFO
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<main class="card">
    <div th:replace="~{fragments/layout :: brand}"></div>
    <h1>Forgot your password?</h1>
    <p class="subtitle">Enter your email and we will send you a link to choose a new password.</p>

    <div class="alert alert-error" th:if="${param.blocked}">
        Too many attempts. Please wait a minute and try again.
    </div>

    <form th:action="@{/forgot-password}" th:object="${form}" method="post" class="form" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" autocomplete="email" required autofocus>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <button type="submit" class="btn-primary">Send reset link</button>
    </form>

    <div class="links">
        <a th:href="@{/login}">Back to sign in</a>
    </div>
</main>
</body>
</html>

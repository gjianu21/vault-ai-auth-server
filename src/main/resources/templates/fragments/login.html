<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="card">
    <div th:replace="~{fragments/layout :: brand}"></div>
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back. Sign in to continue.</p>

    <div class="alert alert-error" th:if="${param.error}">
        Invalid email or password, or the account is temporarily locked.
    </div>
    <div class="alert alert-error" th:if="${param.blocked}">
        Too many attempts. Please wait a minute and try again.
    </div>
    <div class="alert alert-info" th:if="${param.logout}">
        You have been signed out.
    </div>

    <form th:action="@{/login}" method="post" class="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="links">
        <a th:href="@{/forgot-password}">Forgot your password?</a>
        <a th:href="@{/register}">Create an account</a>
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Choose a new password')}"></head>
<body>
<main class="card">
    <div th:replace="~{fragments/layout :: brand}"></div>
    <h1>Choose a new password</h1>
    <p class="subtitle">After the change you will be signed out on all devices.</p>

    <form th:action="@{/reset-password}" th:object="${form}" method="post" class="form" novalidate>
        <input type="hidden" th:field="*{token}">

        <label for="password">New password</label>
        <input id="password" type="password" th:field="*{password}" autocomplete="new-password" required autofocus>
        <p class="hint">At least 8 characters.</p>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
        <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        <p class="field-error" th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}"></p>

        <button type="submit" class="btn-primary">Change password</button>
    </form>
</main>
</body>
</html>

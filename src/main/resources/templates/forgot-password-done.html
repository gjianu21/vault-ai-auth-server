<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Check your email')}"></head>
<body>
<main class="card">
    <div th:replace="~{fragments/layout :: brand}"></div>
    <h1>Check your email</h1>
    <p class="subtitle">
        If an account exists for this email, we have sent you a link to reset your password.
    </p>
    <p class="hint">The link is valid for a limited time. Check your spam folder if you don't see it.</p>
    <a class="btn-primary" th:href="${frontendUrl}">Go to Vault AI</a>
</main>
</body>
</html>
